name: Build and Test
on: [push, pull_request]

env:
  GO_VERSION: '1.26.3'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check out source
        uses: actions/checkout@v4

      - name: Build
        run: make build

  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check out source
        uses: actions/checkout@v4

      - name: Test
        run: make unit

  unit-m1:
    name: Unit M1 cold / index rewrite
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check out source
        uses: actions/checkout@v4

      # Focused M1 job: cold-tier, age-out, addrindex/txindex rewrite completeness,
      # and FuzzColdCompaction seed-corpus replay (not covered by plain go test ./...).
      - name: Test M1 regressions
        run: make unit-m1

  unit-race:
    name: Unit race
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check out source
        uses: actions/checkout@v4

      - name: Test
        run: make unit-race

  # The pure-Go fallback path is what ships on Windows and what anyone gets with
  # CGO_ENABLED=0 (cross-compilation, reproducible builds). It must stay green
  # because it is the consensus-critical fallback when the cgo libsecp256k1
  # backend is not selected. This job builds and tests with CGO disabled.
  unit-purego:
    name: Unit (pure-Go fallback)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check out source
        uses: actions/checkout@v4

      - name: Build (pure-Go)
        run: make build

      - name: Test (pure-Go)
        run: make unit

  # Native arm64 cgo job: confirms the libsecp256k1 cgo backend builds and passes
  # on arm64 (the other non-Windows server target that gets the fast path).
  unit-arm64-cgo:
    name: Unit (cgo, arm64)
    runs-on: ubuntu-24.04-arm
    env:
      CGO_ENABLED: '1'
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check out source
        uses: actions/checkout@v4

      - name: Build (cgo, arm64)
        run: make build

      - name: Test (cgo, arm64)
        run: make unit
